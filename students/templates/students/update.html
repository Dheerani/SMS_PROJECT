{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
<div class="col-md-6">

<div class="card shadow">
    <div class="card-body">

        <h4 class="text-center mb-3">Update Student</h4>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <input type="text" name="name" value="{{ student.name }}" class="form-control mb-2">

            <input type="text" name="roll_no" value="{{ student.roll_no }}" class="form-control mb-2">

            <input type="email" name="email" value="{{ student.email }}" class="form-control mb-2">

            {% comment %} <input type="text" name="course" value="{{ student.course }}" class="form-control mb-2"> {% endcomment %}

            <select name="course" class="form-control">

            {% for c in courses %}
                <option value="{{ c.id }}"
                    {% if student.course and student.course.id == c.id %}selected{% endif %}>
                    {{ c.name }}
                </option>
            {% endfor %}

</select>

            {% if student.image %}
                <img src="{{ student.image.url }}" width="120" class="mb-2">
            {% endif %}

            <input type="file" name="image" class="form-control mb-3">

            <button class="btn btn-primary w-100">Update Student</button>
        </form>

    </div>
</div>

</div>
</div>

{% endblock %}
