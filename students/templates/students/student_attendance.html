{% extends 'base.html' %}

{% block content %}

<h3 class="mb-4 text-center">📋 Student Attendance</h3>

<div class="row g-4">

{% for s in students %}

<div class="col-md-4 d-flex">

    <div class="card text-center p-3 w-100 shadow-sm">

        <!-- IMAGE -->
        <div class="profile-img mx-auto">
            {% if s.image %}
                <img src="{{ s.image.url }}">
            {% else %}
                <img src="https://i.pravatar.cc/150?img=5">
            {% endif %}
        </div>

        <!-- NAME -->
        <h5 class="mt-3">{{ s.name }}</h5>

        <!-- DETAILS -->
        <p class="text-muted mb-1">Roll: {{ s.roll_no }}</p>
        <p class="text-muted mb-2">{{ s.course }}</p>

        <!-- ATTENDANCE BUTTONS -->
        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="student_id" value="{{ s.id }}">

            <div class="d-flex gap-2">
                <button name="status" value="Present"
                        class="btn btn-success w-50">
                    ✔ Present
                </button>

                <button name="status" value="Absent"
                        class="btn btn-danger w-50">
                    ✖ Absent
                </button>
            </div>
        </form>

    </div>

</div>

{% endfor %}

</div>

{% endblock %}
