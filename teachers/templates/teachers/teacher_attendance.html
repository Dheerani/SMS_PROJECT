{% extends 'base.html' %}

{% block content %}

<h3 class="mb-4 text-center">👨‍🏫 Teacher Attendance</h3>

<div class="row g-4">

{% for t in teachers %}

<div class="col-md-4 d-flex">

    <div class="card text-center p-3 w-100 shadow-sm">

        <div class="profile-img mx-auto">
            {% if t.image %}
                <img src="{{ t.image.url }}">
            {% else %}
                <img src="https://i.pravatar.cc/150?img=8">
            {% endif %}
        </div>

        <h5 class="mt-3">{{ t.name }}</h5>
        <p class="text-muted mb-2">{{ t.subject }}</p>

        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="teacher_id" value="{{ t.id }}">

            <div class="d-flex gap-2">
                <button name="status" value="Present"
                        class="btn btn-success w-50">
                    ✔ Present
                </button>

                <button name="status" value="Absent"
                        class="btn btn-danger w-50">
                    ✖ Absent
                </button>
            </div>
        </form>

    </div>

</div>

{% endfor %}

</div>

{% endblock %}
